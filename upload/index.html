<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF与图片合并工具</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            margin-bottom: 20px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: scale(1.01);
        }

        .upload-area .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .upload-area h3 {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .upload-area p {
            color: #666;
            font-size: 1em;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .options-section {
            margin: 25px 0;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 12px;
        }

        .options-section h3 {
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-item label {
            color: #444;
            font-weight: 500;
        }

        .option-item select, .option-item input[type="number"] {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .option-item select:focus, .option-item input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-list {
            margin-top: 20px;
        }

        .file-list h3 {
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-count {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .file-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .file-item {
            display: flex;
            align-items: center;
            background: #f8f9ff;
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s ease;
            cursor: grab;
            border: 2px solid transparent;
        }

        .file-item:hover {
            background: #f0f2ff;
            border-color: #667eea;
        }

        .file-item.dragging {
            opacity: 0.5;
            transform: scale(0.98);
        }

        .file-item .drag-handle {
            color: #aaa;
            font-size: 20px;
            margin-right: 15px;
            cursor: grab;
        }

        .file-item .preview {
            width: 50px;
            height: 50px;
            background: #ddd;
            border-radius: 8px;
            margin-right: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .file-item .preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-item .info {
            flex: 1;
        }

        .file-item .name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .file-item .meta {
            font-size: 0.85em;
            color: #666;
        }

        .file-item .orientation-badge {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75em;
            font-weight: 600;
            margin-right: 10px;
        }

        .orientation-badge.portrait {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .orientation-badge.landscape {
            background: #fff3e0;
            color: #ef6c00;
        }

        .file-item .delete-btn {
            background: #ffebee;
            color: #d32f2f;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .file-item .delete-btn:hover {
            background: #d32f2f;
            color: white;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            justify-content: center;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .tips {
            background: #fff8e1;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .tips h4 {
            color: #f57c00;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tips ul {
            margin-left: 25px;
            color: #666;
        }

        .tips li {
            margin: 8px 0;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .upload-area {
                padding: 40px 20px;
            }

            .option-group {
                flex-direction: column;
                align-items: flex-start;
            }

            .actions {
                flex-direction: column;
            }

            .file-item {
                flex-wrap: wrap;
            }

            .file-item .info {
                width: calc(100% - 100px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 PDF与图片合并工具</h1>
            <p>上传PDF和图片，智能合并为一个可打印的PDF文件</p>
        </div>

        <div class="card">
            <div class="upload-area" id="uploadArea">
                <div class="icon">📁</div>
                <h3>拖拽文件到这里，或点击选择</h3>
                <p>支持 PDF、JPG、PNG、GIF、BMP、WEBP 格式，可同时选择多个文件</p>
                <input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.bmp,.webp">
            </div>

            <div class="options-section">
                <h3>⚙️ 合并选项</h3>
                <div class="option-group">
                    <div class="option-item">
                        <label for="pageSize">目标纸张大小：</label>
                        <select id="pageSize">
                            <option value="auto">自动（保持原尺寸）</option>
                            <option value="a4">A4 (210×297mm)</option>
                            <option value="letter">Letter (216×279mm)</option>
                            <option value="a3">A3 (297×420mm)</option>
                        </select>
                    </div>
                    <div class="option-item">
                        <label for="orientation">页面方向处理：</label>
                        <select id="orientation">
                            <option value="all-portrait">统一为竖向（适合打印）</option>
                            <option value="all-landscape">统一为横向</option>
                            <option value="keep-original">保持原方向</option>
                        </select>
                    </div>
                    <div class="option-item">
                        <label for="imageQuality">图片质量：</label>
                        <select id="imageQuality">
                            <option value="0.9">高质量</option>
                            <option value="0.7">标准</option>
                            <option value="0.5">较小文件</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="file-list">
                <h3>📋 文件列表 <span class="file-count" id="fileCount">0 个文件</span></h3>
                <div class="file-items" id="fileList">
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>还没有添加文件</p>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" id="clearBtn" onclick="clearAllFiles()">
                    🗑️ 清空列表
                </button>
                <button class="btn btn-primary" id="mergeBtn" onclick="mergeFiles()" disabled>
                    📑 合并并下载PDF
                </button>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText">准备中...</p>
            </div>
        </div>

        <div class="tips">
            <h4>💡 使用提示</h4>
            <ul>
                <li><strong>拖拽排序：</strong>可以拖动文件列表中的项目来调整合并顺序</li>
                <li><strong>方向处理：</strong>选择"统一为竖向"可自动将横向页面旋转，方便打印</li>
                <li><strong>自动适配：</strong>图片会自动适应目标纸张大小，保持原始比例</li>
                <li><strong>打印建议：</strong>打印时选择"适应纸张"或"实际大小"以获得最佳效果</li>
            </ul>
        </div>
    </div>

    <script>
        const { PDFDocument, degrees, rgb } = PDFLib;
        
        let uploadedFiles = [];
        let draggedItem = null;

        // 初始化
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        // 点击上传区域
        uploadArea.addEventListener('click', () => fileInput.click());

        // 文件选择
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        // 拖拽事件
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        // 处理文件
        async function handleFiles(files) {
            const validTypes = ['application/pdf', 'image/jpeg', 'image/png', 'image/gif', 'image/bmp', 'image/webp'];
            
            for (let file of files) {
                if (!validTypes.includes(file.type)) {
                    alert(`不支持的文件格式: ${file.name}`);
                    continue;
                }

                const fileData = {
                    id: Date.now() + Math.random(),
                    file: file,
                    name: file.name,
                    type: file.type,
                    size: file.size,
                    preview: null,
                    orientation: 'unknown',
                    pages: 0
                };

                // 生成预览和获取信息
                if (file.type === 'application/pdf') {
                    await processPdfFile(fileData);
                } else {
                    await processImageFile(fileData);
                }

                uploadedFiles.push(fileData);
            }

            updateFileList();
            fileInput.value = '';
        }

        // 处理PDF文件
        async function processPdfFile(fileData) {
            try {
                const arrayBuffer = await fileData.file.arrayBuffer();
                const pdfDoc = await PDFDocument.load(arrayBuffer);
                const pages = pdfDoc.getPages();
                fileData.pages = pages.length;

                // 获取第一页的方向
                const firstPage = pages[0];
                const width = firstPage.getWidth();
                const height = firstPage.getHeight();
                fileData.orientation = width > height ? 'landscape' : 'portrait';
                fileData.width = width;
                fileData.height = height;
                fileData.arrayBuffer = arrayBuffer;

                // 生成预览（简单的PDF图标）
                fileData.preview = '📄';
            } catch (error) {
                console.error('PDF处理错误:', error);
                alert(`PDF文件处理失败: ${fileData.name}`);
            }
        }

        // 处理图片文件
        async function processImageFile(fileData) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        fileData.width = img.width;
                        fileData.height = img.height;
                        fileData.orientation = img.width > img.height ? 'landscape' : 'portrait';
                        fileData.preview = e.target.result;
                        fileData.imgElement = img;
                        fileData.pages = 1;
                        resolve();
                    };
                    img.onerror = () => {
                        fileData.preview = '🖼️';
                        fileData.orientation = 'portrait';
                        fileData.pages = 1;
                        resolve();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(fileData.file);
            });
        }

        // 更新文件列表显示
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            const fileCount = document.getElementById('fileCount');
            const mergeBtn = document.getElementById('mergeBtn');

            fileCount.textContent = `${uploadedFiles.length} 个文件`;
            mergeBtn.disabled = uploadedFiles.length === 0;

            if (uploadedFiles.length === 0) {
                fileList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>还没有添加文件</p>
                    </div>
                `;
                return;
            }

            fileList.innerHTML = uploadedFiles.map((file, index) => `
                <div class="file-item" draggable="true" data-id="${file.id}">
                    <span class="drag-handle">☰</span>
                    <div class="preview">
                        ${file.preview.startsWith('data:') 
                            ? `<img src="${file.preview}" alt="预览">` 
                            : `<span>${file.preview}</span>`}
                    </div>
                    <div class="info">
                        <div class="name">${index + 1}. ${file.name}</div>
                        <div class="meta">
                            ${formatFileSize(file.size)} | 
                            ${file.type === 'application/pdf' ? `PDF (${file.pages}页)` : '图片'} |
                            ${file.width && file.height ? `${Math.round(file.width)} × ${Math.round(file.height)} px` : ''}
                        </div>
                    </div>
                    <span class="orientation-badge ${file.orientation}">
                        ${file.orientation === 'landscape' ? '横向' : file.orientation === 'portrait' ? '竖向' : '未知'}
                    </span>
                    <button class="delete-btn" onclick="removeFile('${file.id}')">删除</button>
                </div>
            `).join('');

            // 添加拖拽事件
            setupDragAndDrop();
        }

        // 设置拖拽排序
        function setupDragAndDrop() {
            const items = document.querySelectorAll('.file-item');
            
            items.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    draggedItem = item;
                    item.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                    draggedItem = null;
                });

                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                });

                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedItem && draggedItem !== item) {
                        const draggedId = parseFloat(draggedItem.dataset.id);
                        const targetId = parseFloat(item.dataset.id);
                        
                        const draggedIndex = uploadedFiles.findIndex(f => f.id === draggedId);
                        const targetIndex = uploadedFiles.findIndex(f => f.id === targetId);
                        
                        if (draggedIndex !== -1 && targetIndex !== -1) {
                            const [removed] = uploadedFiles.splice(draggedIndex, 1);
                            uploadedFiles.splice(targetIndex, 0, removed);
                            updateFileList();
                        }
                    }
                });
            });
        }

        // 删除文件
        function removeFile(id) {
            uploadedFiles = uploadedFiles.filter(f => f.id !== parseFloat(id));
            updateFileList();
        }

        // 清空所有文件
        function clearAllFiles() {
            if (uploadedFiles.length === 0) return;
            if (confirm('确定要清空所有文件吗？')) {
                uploadedFiles = [];
                updateFileList();
            }
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // 合并文件
        async function mergeFiles() {
            if (uploadedFiles.length === 0) return;

            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const mergeBtn = document.getElementById('mergeBtn');

            progressContainer.classList.add('active');
            mergeBtn.disabled = true;
            progressFill.style.width = '0%';

            try {
                const pageSize = document.getElementById('pageSize').value;
                const orientation = document.getElementById('orientation').value;
                const imageQuality = parseFloat(document.getElementById('imageQuality').value);

                // 创建新的PDF文档
                const mergedPdf = await PDFDocument.create();
                
                // 纸张尺寸（单位：点，1点 = 1/72英寸）
                const pageSizes = {
                    'a4': { width: 595.28, height: 841.89 },
                    'letter': { width: 612, height: 792 },
                    'a3': { width: 841.89, height: 1190.55 }
                };

                let totalProcessed = 0;
                const totalItems = uploadedFiles.length;

                for (let fileData of uploadedFiles) {
                    progressText.textContent = `正在处理: ${fileData.name}`;
                    progressFill.style.width = `${(totalProcessed / totalItems) * 100}%`;

                    if (fileData.type === 'application/pdf') {
                        // 处理PDF文件
                        await addPdfPages(mergedPdf, fileData, pageSize, orientation, pageSizes);
                    } else {
                        // 处理图片文件
                        await addImagePage(mergedPdf, fileData, pageSize, orientation, pageSizes, imageQuality);
                    }

                    totalProcessed++;
                    // 给UI更新一点时间
                    await new Promise(resolve => setTimeout(resolve, 10));
                }

                progressText.textContent = '正在生成PDF文件...';
                progressFill.style.width = '90%';

                // 保存合并后的PDF
                const mergedPdfBytes = await mergedPdf.save();
                
                progressFill.style.width = '100%';
                progressText.textContent = '完成！正在下载...';

                // 下载
                const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `合并文档_${new Date().toISOString().slice(0,10)}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                setTimeout(() => {
                    progressContainer.classList.remove('active');
                    mergeBtn.disabled = false;
                }, 1000);

            } catch (error) {
                console.error('合并错误:', error);
                alert('合并过程中出现错误: ' + error.message);
                progressContainer.classList.remove('active');
                mergeBtn.disabled = false;
            }
        }

        // 添加PDF页面（简化且正确的版本）
        async function addPdfPages(mergedPdf, fileData, pageSize, orientation, pageSizes) {
            const sourcePdf = await PDFDocument.load(fileData.arrayBuffer);
            const pages = sourcePdf.getPages();
            const totalPages = pages.length;
            
            // 获取所有页面的索引
            const pageIndices = Array.from({ length: totalPages }, (_, i) => i);
            
            // 批量复制所有页面
            const copiedPages = await mergedPdf.copyPages(sourcePdf, pageIndices);
            
            // 逐个添加并处理旋转
            for (let i = 0; i < copiedPages.length; i++) {
                const copiedPage = copiedPages[i];
                const originalPage = pages[i];
                
                // 获取原始页面尺寸
                let pageWidth = originalPage.getWidth();
                let pageHeight = originalPage.getHeight();
                
                // 检查原始页面是否已经有旋转
                const existingRotation = originalPage.getRotation().angle;
                
                // 考虑现有旋转后的实际方向
                let effectiveWidth = pageWidth;
                let effectiveHeight = pageHeight;
                
                // 如果页面有90或270度旋转，实际显示时宽高会互换
                if (existingRotation === 90 || existingRotation === 270) {
                    [effectiveWidth, effectiveHeight] = [effectiveHeight, effectiveWidth];
                }
                
                const isLandscape = effectiveWidth > effectiveHeight;
                
                // 添加页面到合并的PDF
                const addedPage = mergedPdf.addPage(copiedPage);
                
                // 判断是否需要额外旋转
                let needRotate = false;
                if (orientation === 'all-portrait' && isLandscape) {
                    needRotate = true;
                } else if (orientation === 'all-landscape' && !isLandscape) {
                    needRotate = true;
                }
                
                // 应用旋转（在原有旋转基础上增加90度）
                if (needRotate) {
                    const newRotation = (existingRotation + 90) % 360;
                    addedPage.setRotation(degrees(newRotation));
                }
            }
        }

        // 添加图片页面（简化且正确的版本）
        async function addImagePage(mergedPdf, fileData, pageSize, orientation, pageSizes, quality) {
            // 图片原始尺寸（像素）
            let imgWidth = fileData.width;
            let imgHeight = fileData.height;
            
            // 判断图片方向
            const isLandscape = imgWidth > imgHeight;
            let needRotate = false;
            
            // 判断是否需要旋转（旋转90度）
            if (orientation === 'all-portrait' && isLandscape) {
                needRotate = true;
            } else if (orientation === 'all-landscape' && !isLandscape) {
                needRotate = true;
            }
            
            // 如果需要旋转，图片在页面上显示时宽高互换
            let displayWidth = needRotate ? imgHeight : imgWidth;
            let displayHeight = needRotate ? imgWidth : imgHeight;

            // 确定页面尺寸和绘制尺寸
            let pageWidth, pageHeight, drawWidth, drawHeight;
            
            if (pageSize === 'auto') {
                // 使用图片原始尺寸作为页面尺寸（转换为点，假设72dpi）
                // 为了更好的显示效果，使用合理的DPI转换
                const dpi = 72;
                pageWidth = displayWidth * 72 / 96; // 假设图片是96dpi
                pageHeight = displayHeight * 72 / 96;
                drawWidth = pageWidth;
                drawHeight = pageHeight;
            } else {
                const size = pageSizes[pageSize];
                pageWidth = size.width;
                pageHeight = size.height;
                
                // 计算适应尺寸（保持比例）
                const scaleX = pageWidth / displayWidth;
                const scaleY = pageHeight / displayHeight;
                const scale = Math.min(scaleX, scaleY, 1); // 不放大图片
                
                drawWidth = displayWidth * scale;
                drawHeight = displayHeight * scale;
            }

            // 创建页面
            const page = mergedPdf.addPage([pageWidth, pageHeight]);

            // 嵌入图片
            let image;
            try {
                if (fileData.type === 'image/jpeg' || fileData.type === 'image/jpg') {
                    const imageBytes = await fileData.file.arrayBuffer();
                    image = await mergedPdf.embedJpg(imageBytes);
                } else if (fileData.type === 'image/png') {
                    const imageBytes = await fileData.file.arrayBuffer();
                    image = await mergedPdf.embedPng(imageBytes);
                } else {
                    // 其他格式通过Canvas转换为PNG
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = fileData.width;
                    canvas.height = fileData.height;
                    ctx.drawImage(fileData.imgElement, 0, 0);
                    
                    const pngData = canvas.toDataURL('image/png', quality);
                    const base64 = pngData.split(',')[1];
                    const imageBytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
                    image = await mergedPdf.embedPng(imageBytes);
                }
            } catch (error) {
                console.error('图片嵌入错误:', error);
                return;
            }

            // 计算绘制位置（居中）
            const x = (pageWidth - drawWidth) / 2;
            const y = (pageHeight - drawHeight) / 2;

            // 绘制图片
            page.drawImage(image, {
                x: x,
                y: y,
                width: drawWidth,
                height: drawHeight
            });
            
            // 如果需要旋转页面
            if (needRotate) {
                page.setRotation(degrees(90));
            }
        }

        // 页面加载完成后初始化
        updateFileList();
    </script>
</body>
